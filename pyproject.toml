[project]
name = "chitragupta"
version = "0.1.0"
description = "Local-first personal context layer for AI. Your knowledge lives on your machine; any model can recall it. A privacy-first alternative to Turnstone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Suryansh Singh" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "mcp>=1.2.0",
    "typer>=0.12",
    "rich>=13.7",
    "ddgs>=9.0",
    # AES-GCM for encrypted backups (`chitragupta/archive/`). There is no AEAD
    # cipher in the standard library, which is the only reason this is here —
    # the KDF is `hashlib.scrypt`. Declared explicitly rather than leaned on
    # transitively: it arrives with `google-auth-oauthlib`, which is an
    # optional extra, so a base install without the Gmail connector would
    # otherwise have no way to write or read a backup.
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Higher-quality local embeddings (bigger install). Optional — a pure-python
# fallback embedding always works with zero extra deps.
local-embeddings = ["sentence-transformers>=2.7"]
# Connector SDKs. Installed only if you use the connector.
gmail = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.2"]
gdrive = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.2", "pypdf>=4.0", "python-docx>=1.1", "python-pptx>=0.6"]
notion = ["notion-client>=2.2"]
# Telegram's own client API (MTProto), for the user's real conversations —
# not the Bot API, which only sees chats a bot was added to. Slack needs no
# entry: it is the official Web API over httpx, already a base dependency.
telegram = ["telethon>=1.36"]
desktop = ["pywebview>=5.0"]
# Driving a real browser for the sites a user allows. Optional because the
# browser itself is a separate ~150 MB download managed at runtime
# (browser/chromium.py), and the app is fully usable without it.
browser = ["playwright>=1.49"]
all = [
    "playwright>=1.49",
    "sentence-transformers>=2.7",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "pypdf>=4.0",
    "notion-client>=2.2",
    "telethon>=1.36",
]

[project.scripts]
chitragupta = "chitragupta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chitragupta"]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".venv", "brain-export"]

[tool.ruff.lint]
# Wave 2. The gate opened on `F, E9` — correctness only — with a note to widen
# it in waves rather than ship a pipeline that is red on arrival and therefore
# ignored. This is that widening: ~340 findings were reviewed and fixed, three
# of them real (a sort key computed as `0 if x else 0`, a `msg if ok else msg`,
# duplicate members in a literal set).
select = [
    "F",      # pyflakes — undefined names, unused imports, real mistakes
    "E4", "E7", "E9",  # pycodestyle errors worth having
    "W",      # whitespace problems that hide diffs
    "B",      # bugbear — mutable defaults, unchained raises, loop-variable bugs
    "UP",     # pyupgrade — keep to the Python version we actually require
    "I",      # import order, so diffs stay small
    "SIM",    # simplifications that remove branches rather than shorten lines
    "RUF",    # ruff's own checks
    "C4", "PIE", "RET",
    "ASYNC",  # blocking calls on the event loop — see api/concurrency.py
    "LOG", "G",  # logging that is lazy and structured
    "PTH", "N",
]

ignore = [
    # Compact one-liners (`aid = f"{base}-{n}"; n += 1`) are used deliberately
    # throughout; rewriting 39 of them is churn, not clarity.
    "E702",
    # A few modules import late on purpose — after an environment is pinned, or
    # to keep an optional dependency optional.
    "E402",
    # `l` as a loop variable in a handful of tight numeric loops.
    "E741",
    # Nested `with patch(...)` reads better than one line of six contexts.
    "SIM117",
    # Judgement calls about readability, not correctness.
    "SIM102", "SIM108",
    # **Load-bearing.** SIM401 rewrites `row["k"] if "k" in row else d` into
    # `row.get("k", d)`. Rows here are `sqlite3.Row`, which supports `in` and
    # `[]` but has NO `.get` — applying this fix raised AttributeError at
    # runtime and broke the graph store. Do not enable without checking the
    # row type at every site.
    "SIM401",
    # **Load-bearing, same reason.** SIM118 strips `.keys()` from
    # `"col" in row.keys()`. On a `sqlite3.Row`, `"col" in row` tests the row's
    # VALUES, not its keys — it is not a shorter spelling, it is a different
    # question. That exact guard, written without `.keys()`, is what made the
    # graph store discard every stored importance and confidence
    # (see tests/test_sqlite_row_membership.py).
    "SIM118",
    # Prose in this codebase uses —, ·, × and … on purpose.
    "RUF001", "RUF002", "RUF003",
    # Would require a ClassVar sweep for no behavioural gain.
    "RUF012",
    # StrEnum changes comparison semantics; not a lint-time decision.
    "UP042",
    # `os.path` is clearer than `Path` when manipulating a PATH string.
    "PTH112", "PTH123",
    # A few deliberate names (module aliases, a DATA constant).
    "N802", "N806", "N812",
]

[tool.ruff.lint.per-file-ignores]
# Tests bind results they never read, purely to make the call happen.
"tests/*" = ["F841", "RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_oauth_server: test drives the OAuth callback over real HTTP (binds port 1455)",
]
filterwarnings = ["ignore::DeprecationWarning"]


# ── Coverage ─────────────────────────────────────────────────────────────────
# There is no threshold here and there should not be one. A percentage invites
# tests written to raise it, which is the opposite of the point: the question
# this answers is *which* code a change is moving — protected, or not.
#
# It has already earned its place. `models/cursor.py` and `models/grok_cli.py`
# hold ~90 byte-identical lines of the vendor-CLI login machine; the cursor copy
# is covered and `grok_cli.cancel_cli_login()` is not covered at all. Reading
# either file tells you nothing about that.
#
# Run it locally with:  pytest --cov --cov-report=term-missing
#
# Nothing is omitted. `desktop.py` sits at 31% because `run_app` needs a real
# window, and that is worth seeing rather than hiding — a file excluded to keep
# the number tidy is the number lying.
[tool.coverage.run]
source = ["chitragupta"]

[tool.coverage.report]
# `pass`-only bodies and `if TYPE_CHECKING` are noise in the missing-lines list.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]


# ── Type checking ────────────────────────────────────────────────────────────
# Same philosophy as the lint gate: strict where it pays, lenient where it would
# only produce suppressions. The app is full of deliberately dynamic code —
# provider payloads, duck-typed connectors, sqlite rows — and demanding full
# annotations there would buy noise.
#
# Strict is switched on for the modules that are *contracts*: the security
# boundary, the concurrency lanes, the shared request shapes, the error
# taxonomy, the connection state machine. Those are where a wrong type is a
# real bug and where the next person needs the signature to be true.
#
# Tighten module by module. A module joins the strict list once it is clean —
# never by adding ignores to make it pass.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true          # optional connector SDKs are not installed
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = false
exclude = ["^\\.venv/", "^brain-export/"]

[[tool.mypy.overrides]]
module = [
    "chitragupta.api.app",
    "chitragupta.api.assets",
    "chitragupta.api.concurrency",
    "chitragupta.api.schemas",
    "chitragupta.api.security",
    "chitragupta.core.models",
    "chitragupta.log",
    "chitragupta.models.capabilities",
    "chitragupta.models.connections",
    "chitragupta.models.errors",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true

# Modules that predate the type gate. New code is checked by default — this list
# is the grandfathered remainder, and it only ever gets shorter. Removing a name
# and finding it clean is the whole ritual; adding one is not.
#
# What is left here is overwhelmingly *precision*, not bugs: provider payloads
# typed as `Any`, duck-typed connector capabilities, sqlite rows. The errors
# that were real have been fixed — a sort key that was always zero, a graph
# store discarding every stored confidence, a `.write()` on a stdin that could
# be None, a regex searched twice with the second search unguarded.
[[tool.mypy.overrides]]
module = [
    "chitragupta.agents.custom",
    "chitragupta.agents.tools",
    "chitragupta.api.routes.agents",
    "chitragupta.api.routes.providers",
    "chitragupta.brain.brain",
    "chitragupta.brain.graph",
    "chitragupta.connectors.apple_mail",
    "chitragupta.connectors.gcal",
    "chitragupta.core.embeddings",
    "chitragupta.core.store",
    "chitragupta.models.cursor",
    "chitragupta.models.gemini",
    "chitragupta.models.openai_compat",
    "chitragupta.models.registry",
    "chitragupta.reminders",
    "chitragupta.routines",
    "chitragupta.tasks",
]
ignore_errors = true
